        * { margin: 0; padding: 0; box-sizing: border-box; }
        /* Scale.FIT letterboxes the fixed design box; what `html`/`body` paint is what shows in

           preloader colour (= visuals/ui/preloader bgColor + capacitor android.backgroundColor +
           the Android launch theme: one colour from the icon tap to the first Phaser frame). */
        html, body { background: #000; height: 100%; overflow: hidden; margin: 0; }
        canvas { background: #3aacab; }
        /* touch-action: none → the browser stops claiming pan/pinch, so every touch reaches Phaser
           (pinch-zoom + camera drag). overscroll-behavior kills the pull-to-refresh bounce.
           `html` is in the list too: Chrome on Android resolves a pinch against the ROOT element, so
           leaving it `auto` let the gesture leak into browser page-zoom once our own zoom hit its
           clamp — and `maximum-scale=1` then snapped the page back, which read as the zoom looping. */
        html, body, canvas { touch-action: none; overscroll-behavior: none;
                       -webkit-user-select: none; user-select: none;
                       -webkit-tap-highlight-color: transparent; }
    </style>

azyGames kein Werbenetzwerk von Drittanbietern.\n\n3. KINDER\nDas Spiel ist f\xFCr ein allgemeines Publikum geeignet (PEGI 12). Es erfasst nicht wissentlich personenbezogene Daten von Kindern. Werbung und Analyse folgen den Richtlinien der CrazyGames-Plattform.\n\n4. DEINE WAHLM\xD6GLICHKEITEN\nDu kannst lokal gespeicherte Daten jederzeit l\xF6schen, indem du deinen Browser-Speicher leerst oder in den Einstellungen \u201ENeues Spiel\u201C verwendest. F\xFCr auf der CrazyGames-Plattform verarbeitete Daten siehe die Datenschutzrichtlinie von CrazyGames.\n\n5. NUTZUNGSBEDINGUNGEN\nDieses Spiel wird \u201Ewie besehen\u201C zu Unterhaltungszwecken ohne jegliche Gew\xE4hrleistung bereitgestellt. Wir haften nicht f\xFCr Sch\xE4den, die aus seiner Nutzung entstehen. Alle Assets werden gem\xE4\xDF ihren jeweiligen Lizenzen verwendet. Diese Bedingungen k\xF6nnen sich \xE4ndern; fortgesetztes Spielen bedeutet, dass du die aktuelle Version akzeptierst.\n\n6. KONTAKT\nFragen zu dieser Richtlinie: Aiwa Int \u2014 aiwainit2023@gmail.com"},es:{"settings.title":"AJUSTES","settings.graphics":"Gr\xE1ficos","settings.quality":"Calidad","settings.quality.low":"baja","settings.quality.medium":"media","settings.quality.high":"alta","settings.language":"Idioma","settings.music":"M\xFAsica","settings.sound":"Sonido","settings.ambient":"Ambiente","settings.skipTutorial":"Saltar tutorial","settings.logPanel":"Registro de depuraci\xF3n","settings.on":"Activado","settings.off":"Desactivado","settings.tip":"La calidad afecta a las animaciones y los efectos de agua (mejora los FPS en dispositivos poco potentes).","settings.privacy":"Este juego recopila anal\xEDticas de juego an\xF3nimas (GameAnalytics) para mejorar el juego.","settings.progress":"Progreso","settings.progress.buildings":"Edificios","settings.progress.upgrades":"Mejoras","settings.legal.link":"Privacidad y t\xE9rminos","settings.legal.title":"PRIVACIDAD Y T\xC9RMINOS","settings.legal.body":"Desarrollador: Aiwa Int\nContacto: aiwain a a un enemigo","quests.hitEnemy.hint":"Haz clic en un enemigo atacante: tus clics tambi\xE9n le hacen da\xF1o.","quests.hitBarrel.title":"Revienta un barril","quests.hitBarrel.hint":"Haz clic en un barril rodante antes de que llegue a los muros.","quests.complete.title":"\xA1Bien hecho!","quests.complete.hint":"De aqu\xED en adelante, t\xFA decides: crece, expande, conquista."},fr:{"quests.label":"Objectif","quests.chop.title":"Touche les trois","quests.chop.hint":"Une seule touche et la ressource se r\xE9colte toute seule. Touche les trois : les paysans portent le butin au ch\xE2teau contre de l'or.","quests.land.title":"\xC9l\xE8ve la terre","quests.land.hint":"Touche 3 fois une case d'eau encadr\xE9e : plus de terre, plus de b\xE2timents et de ressources.","quests.buildTower.title":"Construis la Tour","quests.buildTower.hint":"Clique sur CONSTRUIRE jusqu'\xE0 remplir la barre : la Tour commence \xE0 s'\xE9lever.","quests.hitEnemy.title":"Frappe un ennemi","quests.hitEnemy.hint":"Clique sur un ennemi qui attaque : tes clics lui font aussi des d\xE9g\xE2ts.","quests.hitBarrel.title":"Fais sauter un baril","quests.hitBarrel.hint":"Clique sur un baril qui roule avant qu'il n'atteigne les murs.","quests.complete.title":"Bien jou\xE9 !","quests.complete.hint":"\xC0 partir de l\xE0, c'est toi qui d\xE9cides : grandis, \xE9tends-toi, conquiers."},it:{"quests.label":"Obiettivo","quests.chop.title":"Tocca tutti e tre","quests.chop.hint":"Un tocco e la risorsa si raccoglie da sola. Tocca tutti e tre: i contadini portano il raccolto al castello in cambio di oro.","quests.land.title":"Solleva la terra","quests.land.hint":"Tocca 3 volte una casella d'acqua incorniciata: pi\xF9 terra porta nuovi edifici e risorse.","quests.buildTower.title":"Costruisci la Torre","quests.buildTower.hint":"Premi il tasto COSTRUISCI finch\xE9 la barra si riempie: la Torre inizia a sorgere.","quests.hitEnemy.title":"Colpisci un nemico","quests.hitEnemy.hint":"Clicca un nemico che attacca: anche i .","quests.hitBarrel.title":"Exploda um barril","quests.hitBarrel.hint":"Clique num barril rolando antes que ele chegue \xE0s muralhas.","quests.complete.title":"Muito bem!","quests.complete.hint":"Daqui em diante \xE9 com voc\xEA \u2014 cres\xE7a, expanda, conquiste."}};var qb={en:{"goals.label":"Goals","goals.done":"Goal done!  +{reward} \u{1F48E}","goals.wave5.title":"Survive wave 5","goals.wave10.title":"Survive wave 10","goals.wave25.title":"Survive wave 25","goals.coins1k.title":"1000 coins","goals.coins5k.title":"5000 coins","goals.build10.title":"10 building levels"},uk:{"goals.label":"\u0426\u0456\u043B\u0456","goals.done":"\u0426\u0456\u043B\u044C \u0432\u0438\u043A\u043E\u043D\u0430\u043D\u043E!  +{reward} \u{1F48E}","goals.wave5.title":"\u041F\u0435\u0440\u0435\u0436\u0438\u0432\u0438 \u0445\u0432\u0438\u043B\u044E 5","goals.wave10.title":"\u041F\u0435\u0440\u0435\u0436\u0438\u0432\u0438 \u0445\u0432\u0438\u043B\u044E 10","goals.wave25.title":"\u041F\u0435\u0440\u0435\u0436\u0438\u0432\u0438 \u0445\u0432\u0438\u043B\u044E 25","goals.coins1k.title":"1000 \u043C\u043E\u043D\u0435\u0442","goals.coins5k.title":"5000 \u043C\u043E\u043D\u0435\u0442","goals.build10.title":"10 \u0440\u0456\u0432\u043D\u0456\u0432 \u0431\u0443\u0434\u0456\u0432\u0435\u043B\u044C"},de:{"goals.label":"Ziele","goals.done":"Ziel erf\xFCllt!  +{reward} \u{1F48E}","goals.wave5.title":"Welle 5 \xFCberstehen","goals.wave10.title":"Welle 10 \xFCberstehen","goals.wave25.title":"Welle 25 \xFCberstehen","goals.coins1k.title":"1000 M\xFCnzen","goals.coins5k.title":"5000 M\xFCnzen","goals.build10.title":"10 Geb\xE4udestufen"},es:{"goals.label":"Objetivos","goals.done":"\xA1Objetivo cumplido!  +{reward} \u{1F48E}","goals.wave5.title":"Sobrevive a la oleada 5","goals.wave10.title":"Sobrevive a la oleada 10","goals.wave25.title":"Sobrevive a la oleada 25","goals.coins1k.title":"1000 monedas","goals.coins5k.title":"5000 monedas","goals.build10.title":"10 niveles de edificios"},fr:{"goals.label":"O
