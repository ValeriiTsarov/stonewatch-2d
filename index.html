ini","settings.legal.title":"PRIVACY E TERMINI","settings.legal.body":"Sviluppatore: Aiwa Int\nContatto: aiwainit2023@gmail.com\n\nQuesto gioco \xE8 distribuito sulla piattaforma CrazyGames. Giocandoci, accetti i punti seguenti.\n\n1. DATI RACCOLTI\n\u2022 Pubblicit\xE0 (CrazyGames Ads). Gli annunci vengono mostrati ESCLUSIVAMENTE tramite l\u2019SDK di CrazyGames Ads. Per mostrare e misurare gli annunci, CrazyGames e i suoi partner pubblicitari possono trattare dati tecnici come il tipo di dispositivo, il browser, l\u2019indirizzo IP (per la posizione approssimativa) e le interazioni con gli annunci. Ci\xF2 \xE8 gestito da CrazyGames secondo la propria Informativa sulla privacy (crazygames.com/privacy). Non utilizziamo alcun altro network pubblicitario.\n\u2022 Analisi. Utilizziamo GameAnalytics per raccogliere dati di gioco ANONIMI \u2014 eventi di gioco, durata della sessione, progressi, tipo di dispositivo e paese \u2014 per capire come viene giocato il gioco e migliorarlo. Non vengono usati per identificarti personalmente. Vedi gameanalytics.com/privacy.\n\u2022 Progressi salvati. I tuoi progressi e le impostazioni sono salvati localmente nel tuo browser e, su CrazyGames, possono essere sincronizzati tramite il salvataggio cloud di CrazyGames per farti continuare su pi\xF9 dispositivi.\n\n2. COSA NON FACCIAMO\n\u2022 Non ti chiediamo mai il nome, l\u2019email o alcun account personale nel gioco.\n\u2022 Non vendiamo i tuoi dati personali.\n\u2022 Non usiamo alcun network pubblicitario di terze parti oltre a CrazyGames.\n\n3. BAMBINI\nIl gioco \xE8 adatto a un pubblico generale (PEGI 12). Non raccoglie consapevolmente informazioni personali dai bambini. Pubblicit\xE0 e analisi seguono le politiche della piattaforma CrazyGames.\n\n4. LE TUE SCELTE\nPuoi cancellare i dati salvati localmente in qualsiasi momento svuotando l\u2019archivio del browser o usando \xABNuova partita\xBB nelle Impostazioni. Per i dati trattati sulla piattaforma CrazyGames, consulta l\u2019I
