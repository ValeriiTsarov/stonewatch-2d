    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        /* Scale.FIT letterboxes the fixed design box; what `html`/`body` paint is what shows in
           those bars — BLACK, so nothing competes with the game box. The canvas keeps the
           preloader colour (= visuals/ui/preloader bgColor + capacitor android.backgroundColor +
           the Android launch theme: one colour from the icon tap to the first Phaser frame). */
        html, body { background: #000; height: 100%; overflow: hidden; margin: 0; }
        canvas { background: #3aacab; }
        /* touch-action: none → the browser stops claiming pan/pinch, so every touch reaches Phaser
           (pinch-zoom + camera drag). overscroll-behavior kills the pull-to-refresh bounce.
           `html` is in the list too: Chrome on Android resolves a pinch against the ROOT element, so
           leaving it `auto` let the gesture leak into browser page-zoom once our own zoom hit its
           clamp — and `maximum-scale=1` then snapped the page back, which read as the zoom looping. */
        html, body, canvas { touch-action: none; overscroll-behavior: none;
                       -webkit-user-select: none; user-select: none;
                       -webkit-tap-highlight-color: transparent; }
    </style>

azyGames kein Werbenetzwerk von Drittanbietern.\n\n3. KINDER\nDas Spiel ist f\xFCr ein allgemeines Publikum geeignet (PEGI 12). Es erfasst nicht wissentlich personenbezogene Daten von Kindern. Werbung und Analyse folgen den Richtlinien der CrazyGames-Plattform.\n\n4. DEINE WAHLM\xD6GLICHKEITEN\nDu kannst lokal gespeicherte Daten jederzeit l\xF6schen, indem du deinen Browser-Speicher leerst oder in den Einstellungen \u201ENeues Spiel\u201C verwendest. F\xFCr auf der CrazyGames-Plattform verarbeitete Daten siehe die Datenschutzrichtlinie von CrazyGames.\n\n5. NUTZUNGSBEDINGUNGEN\nDieses Spiel wird \u201Ewie besehen\u201C zu Unterhaltungszwecken ohne jegliche Gew\xE4hrleistung bereitgestellt. Wir haften nicht f\xFCr Sch\xE4den, die aus seiner Nutzung entstehen. Alle Assets werden gem\xE4\xDF ihren jeweiligen Lizenzen verwendet. Diese Bedingungen k\xF6nnen sich \xE4ndern; fortgesetztes Spielen bedeutet, dass du die aktuelle Version akzeptierst.\n\n6. KONTAKT\nFragen zu dieser Richtlinie: Aiwa Int \u2014 aiwainit2023@gmail.com"},es:{"settings.title":"AJUSTES","settings.graphics":"Gr\xE1ficos","settings.quality":"Calidad","settings.quality.low":"baja","settings.quality.medium":"media","settings.quality.high":"alta","settings.language":"Idioma","settings.music":"M\xFAsica","settings.sound":"Sonido","settings.ambient":"Ambiente","settings.skipTutorial":"Saltar tutorial","settings.logPanel":"Registro de depuraci\xF3n","settings.on":"Activado","settings.off":"Desactivado","settings.tip":"La calidad afecta a las animaciones y los efectos de agua (mejora los FPS en dispositivos poco potentes).","settings.privacy":"Este juego recopila anal\xEDticas de juego an\xF3nimas (GameAnalytics) para mejorar el juego.","settings.progress":"Progreso","settings.progress.buildings":"Edificios","settings.progress.upgrades":"Mejoras","settings.legal.link":"Privacidad y t\xE9rminos","settings.legal.title":"PRIVACIDAD Y T\xC9RMINOS","settings.legal.body":"Desarrollador: Aiwa Int\nContacto: aiwain ","quests.hitBarrel.hint":"Kliknij tocz\u0105c\u0105 si\u0119 beczk\u0119, zanim dotrze do mur\xF3w.","quests.complete.title":"Dobra robota!","quests.complete.hint":"Od teraz decyzja nale\u017Cy do ciebie \u2014 rozwijaj si\u0119, poszerzaj, podbijaj."},pt:{"quests.label":"Meta","quests.chop.title":"Toque nos tr\xEAs","quests.chop.hint":"Um toque p\xF5e o recurso a render \u2014 ele continua sozinho. Toque em cada um dos tr\xEAs; os camponeses levam tudo ao castelo por moedas.","quests.land.title":"Erga terra","quests.land.hint":"Toque 3 vezes numa c\xE9lula de \xE1gua emoldurada \u2014 mais terra traz novas constru\xE7\xF5es e recursos.","quests.buildTower.title":"Construa a Torre","quests.buildTower.hint":"Clique no bot\xE3o CONSTRUIR at\xE9 a barra encher \u2014 a Torre come\xE7a a subir.","quests.hitEnemy.title":"Acerte um inimigo","quests.hitEnemy.hint":"Clique num inimigo que ataca \u2014 seus cliques tamb\xE9m causam dano.","quests.hitBarrel.title":"Exploda um barril","quests.hitBarrel.hint":"Clique num barril rolando antes que ele chegue \xE0s muralhas.","quests.complete.title":"Muito bem!","quests.complete.hint":"Daqui em diante \xE9 com voc\xEA \u2014 cres\xE7a, expanda, conquiste."}};var nx={en:{"goals.label":"Goals","goals.done":"Goal done!  +{reward} \u{1F48E}","goals.wave5.title":"Survive wave 5","goals.wave10.title":"Survive wave 10","goals.wave25.title":"Survive wave 25","goals.coins1k.title":"1000 coins","goals.coins5k.title":"5000 coins","goals.build10.title":"10 building levels"},uk:{"goals.label":"\u0426\u0456\u043B\u0456","goals.done":"\u0426\u0456\u043B\u044C \u0432\u0438\u043A\u043E\u043D\u0430\u043D\u043E!  +{reward} \u{1F48E}","goals.wave5.title":"\u041F\u0435\u0440\u0435\u0436\u0438\u0432\u0438 \u0445\u0432\u0438\u043B\u044E 5","goals.wave10.title":"\u041F\u0435\u0440\u0435\u0436\u0438\u0432\u0438 \u0445\u0432\u0438\u043B\u044E 10","goals.wave25.title":"\u041F\u0435\u0440\u0435\u0436\u0438\u0432\u0438 \u0445\u0432\u0438\u043B\u044E 25","goa
