        /* = visuals/ui/preloader bgColor + capacitor android.backgroundColor + the Android launch

        body { background: #3aacab; overflow: hidden; margin: 0; }
        /* touch-action: none → the browser stops claiming pan/pinch, so every touch reaches Phaser
           (pinch-zoom + camera drag). overscroll-behavior kills the pull-to-refresh bounce.

           leaving it `auto` let the gesture leak into browser page-zoom once our own zoom hit its
           clamp — and `maximum-scale=1` then snapped the page back, which read as the zoom looping. */
        html, body, canvas { touch-action: none; overscroll-behavior: none;

/privacy.\n\u2022 Gespeicherter Fortschritt. Dein Fortschritt und deine Einstellungen werden lokal in deinem Browser gespeichert und k\xF6nnen auf CrazyGames \xFCber den CrazyGames-Cloud-Speicher synchronisiert werden, damit du auf mehreren Ger\xE4ten weiterspielen kannst.\n\n2. WAS WIR NICHT TUN\n\u2022 Wir fragen niemals nach deinem Namen, deiner E-Mail oder einem pers\xF6nlichen Konto im Spiel.\n\u2022 Wir verkaufen deine personenbezogenen Daten nicht.\n\u2022 Wir nutzen au\xDFer CrazyGames kein Werbenetzwerk von Drittanbietern.\n\n3. KINDER\nDas Spiel ist f\xFCr ein allgemeines Publikum geeignet (PEGI 12). Es erfasst nicht wissentlich personenbezogene Daten von Kindern. Werbung und Analyse folgen den Richtlinien der CrazyGames-Plattform.\n\n4. DEINE WAHLM\xD6GLICHKEITEN\nDu kannst lokal gespeicherte Daten jederzeit l\xF6schen, indem du deinen Browser-Speicher leerst oder in den Einstellungen \u201ENeues Spiel\u201C verwendest. F\xFCr auf der CrazyGames-Plattform verarbeitete Daten siehe die Datenschutzrichtlinie von CrazyGames.\n\n5. NUTZUNGSBEDINGUNGEN\nDieses Spiel wird \u201Ewie besehen\u201C zu Unterhaltungszwecken ohne jegliche Gew\xE4hrleistung bereitgestellt. Wir haften nicht f\xFCr Sch\xE4den, die aus seiner Nutzung entstehen. Alle Assets werden gem\xE4\xDF ihren jeweiligen Lizenzen verwendet. Diese Bedingungen k\xF6nnen sich \xE4ndern; fortgesetztes Spielen bedeutet, dass du die aktuelle Version akzeptierst.\n\n6. KONTAKT\nFragen zu dieser Richtlinie: Aiwa Int \u2014 aiwainit2023@gmail.com"},es:{"settings.title":"AJUSTES","settings.graphics":"Gr\xE1ficos","settings.quality":"Calidad","settings.quality.low":"baja","settings.quality.medium":"media","settings.quality.high":"alta","settings.language":"Idioma","settings.music":"M\xFAsica","settings.sound":"Sonido","settings.ambient":"Ambiente","settings.skipTutorial":"Saltar tutorial","settings.logPanel":"Registro de depuraci\xF3n","settings.on":"Activado","settings.off":"Desactivado","settings.tip":"La cali ialit\xE9 de CrazyGames.\n\n5. CONDITIONS D\u2019UTILISATION\nCe jeu est fourni \xAB tel quel \xBB, \xE0 des fins de divertissement, sans garantie d\u2019aucune sorte. Nous ne sommes pas responsables des pertes d\xE9coulant de son utilisation. Tous les \xE9l\xE9ments sont utilis\xE9s sous leurs licences respectives. Ces conditions peuvent changer ; continuer \xE0 jouer signifie que tu acceptes la version en vigueur.\n\n6. CONTACT\nQuestions sur cette politique : Aiwa Int \u2014 aiwainit2023@gmail.com"},it:{"settings.title":"IMPOSTAZIONI","settings.graphics":"Grafica","settings.quality":"Qualit\xE0","settings.quality.low":"bassa","settings.quality.medium":"media","settings.quality.high":"alta","settings.language":"Lingua","settings.music":"Musica","settings.sound":"Suono","settings.ambient":"Ambiente","settings.skipTutorial":"Salta il tutorial","settings.logPanel":"Log di debug","settings.on":"s\xEC","settings.off":"no","settings.tip":"La qualit\xE0 influisce su animazioni ed effetti dell\u2019acqua (aiuta gli FPS su dispositivi deboli).","settings.privacy":"Questo gioco raccoglie analisi di gioco anonime (GameAnalytics) per migliorare il gioco.","settings.progress":"Progressi","settings.progress.buildings":"Edifici","settings.progress.upgrades":"Potenziamenti","settings.legal.link":"Privacy e termini","settings.legal.title":"PRIVACY E TERMINI","settings.legal.body":"Sviluppatore: Aiwa Int\nContatto: aiwainit2023@gmail.com\n\nQuesto gioco \xE8 distribuito sulla piattaforma CrazyGames. Giocandoci, accetti i punti seguenti.\n\n1. DATI RACCOLTI\n\u2022 Pubblicit\xE0 (CrazyGames Ads). Gli annunci vengono mostrati ESCLUSIVAMENTE tramite l\u2019SDK di CrazyGames Ads. Per mostrare e misurare gli annunci, CrazyGames e i suoi partner pubblicitari possono trattare dati tecnici come il tipo di dispositivo, il browser, l\u2019indirizzo IP (per la posizione approssimativa) e le interazioni con gli annunci. Ci\xF2 \xE8 gestito da CrazyGames secondo la propria Informativa sulla pri
