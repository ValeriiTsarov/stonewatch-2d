gestiona CrazyGames conforme a su propia Pol\xEDtica de Privacidad (crazygames.com/privacy). No usamos ninguna otra red publicitaria.\n\u2022 Anal\xEDtica. Usamos GameAnalytics para recopilar datos de juego AN\xD3NIMOS \u2014 eventos del juego, duraci\xF3n de la sesi\xF3n, progresi\xF3n, tipo de dispositivo y pa\xEDs \u2014 para entender c\xF3mo se juega y mejorarlo. No se usa para identificarte personalmente. Consulta gameanalytics.com/privacy.\n\u2022 Progreso guardado. Tu progreso y ajustes se almacenan localmente en tu navegador y, en CrazyGames, pueden sincronizarse mediante el guardado en la nube de CrazyGames para que puedas continuar entre dispositivos.\n\n2. LO QUE NO HACEMOS\n\u2022 Nunca te pedimos tu nombre, correo electr\xF3nico ni ninguna cuenta personal dentro del juego.\n\u2022 No vendemos tus datos personales.\n\u2022 No usamos ninguna red publicitaria de terceros aparte de CrazyGames.\n\n3. NI\xD1OS\nEl juego es apto para un p\xFAblico general (PEGI 12). No recopila conscientemente informaci\xF3n personal de menores. La publicidad y la anal\xEDtica siguen las pol\xEDticas de la plataforma CrazyGames.\n\n4. TUS OPCIONES\nPuedes borrar los datos almacenados localmente en cualquier momento vaciando el almacenamiento de tu navegador o usando \xABNueva partida\xBB en los Ajustes. Para los datos procesados en la plataforma CrazyGames, consulta la Pol\xEDtica de Privacidad de CrazyGames.\n\n5. CONDICIONES DE USO\nEste juego se ofrece \xABtal cual\xBB, con fines de entretenimiento, sin garant\xEDas de ning\xFAn tipo. No nos hacemos responsables de ninguna p\xE9rdida derivada de su uso. Todos los recursos se utilizan bajo sus respectivas licencias. Estas condiciones pueden cambiar; seguir jugando implica que aceptas la versi\xF3n vigente.\n\n6. CONTACTO\nPreguntas sobre esta pol\xEDtica: Aiwa Int \u2014 aiwainit2023@gmail.com"},fr:{"settings.title":"PARAM\xC8TRES","settings.graphics":"Graphismes","settings.quality":"Qualit\xE9","settings.quality.low":"basse ram\xE8tres sont stock\xE9s localement dans ton navigateur et, sur CrazyGames, peuvent \xEAtre synchronis\xE9s via la sauvegarde cloud de CrazyGames pour que tu puisses continuer sur plusieurs appareils.\n\n2. CE QUE NOUS NE FAISONS PAS\n\u2022 Nous ne demandons jamais ton nom, ton e-mail ou un compte personnel dans le jeu.\n\u2022 Nous ne vendons pas tes donn\xE9es personnelles.\n\u2022 Nous n\u2019utilisons aucun r\xE9seau publicitaire tiers autre que CrazyGames.\n\n3. ENFANTS\nLe jeu convient \xE0 un public g\xE9n\xE9ral (PEGI 12). Il ne collecte pas sciemment d\u2019informations personnelles aupr\xE8s des enfants. La publicit\xE9 et l\u2019analytique suivent les politiques de la plateforme CrazyGames.\n\n4. TES CHOIX\nTu peux effacer les donn\xE9es stock\xE9es localement \xE0 tout moment en vidant le stockage de ton navigateur ou en utilisant \xAB Nouvelle partie \xBB dans les Param\xE8tres. Pour les donn\xE9es trait\xE9es sur la plateforme CrazyGames, consulte la Politique de confidentialit\xE9 de CrazyGames.\n\n5. CONDITIONS D\u2019UTILISATION\nCe jeu est fourni \xAB tel quel \xBB, \xE0 des fins de divertissement, sans garantie d\u2019aucune sorte. Nous ne sommes pas responsables des pertes d\xE9coulant de son utilisation. Tous les \xE9l\xE9ments sont utilis\xE9s sous leurs licences respectives. Ces conditions peuvent changer ; continuer \xE0 jouer signifie que tu acceptes la version en vigueur.\n\n6. CONTACT\nQuestions sur cette politique : Aiwa Int \u2014 aiwainit2023@gmail.com"},it:{"settings.title":"IMPOSTAZIONI","settings.graphics":"Grafica","settings.quality":"Qualit\xE0","settings.quality.low":"bassa","settings.quality.medium":"media","settings.quality.high":"alta","settings.language":"Lingua","settings.music":"Musica","settings.sound":"Suono","settings.ambient":"Ambiente","settings.skipTutorial":"Salta il tutorial","settings.logPanel":"Log di debug","settings.on":"s\xEC","settings.off":"no","settings.tip":"La qualit\xE0 influisce su animazioni ed effet ambini. Pubblicit\xE0 e analisi seguono le politiche della piattaforma CrazyGames.\n\n4. LE TUE SCELTE\nPuoi cancellare i dati salvati localmente in qualsiasi momento svuotando l\u2019archivio del browser o usando \xABNuova partita\xBB nelle Impostazioni. Per i dati trattati sulla piattaforma CrazyGames, consulta l\u2019Informativa sulla privacy di CrazyGames.\n\n5. CONDIZIONI D\u2019USO\nQuesto gioco \xE8 fornito \xABcos\xEC com\u2019\xE8\xBB, a scopo di intrattenimento, senza garanzie di alcun tipo. Non siamo responsabili di eventuali perdite derivanti dal suo utilizzo. Tutte le risorse sono usate secondo le rispettive licenze. Queste condizioni possono cambiare; continuare a giocare significa accettare la versione corrente.\n\n6. CONTATTO\nDomande su questa informativa: Aiwa Int \u2014 aiwainit2023@gmail.com"},pl:{"settings.title":"USTAWIENIA","settings.graphics":"Grafika","settings.quality":"Jako\u015B\u0107","settings.quality.low":"niska","settings.quality.medium":"\u015Brednia","settings.quality.high":"wysoka","settings.language":"J\u0119zyk","settings.music":"Muzyka","settings.sound":"D\u017Awi\u0119k","settings.ambient":"Otoczenie","settings.skipTutorial":"Pomi\u0144 samouczek","settings.logPanel":"Dziennik debugowania","settings.on":"w\u0142.","settings.off":"wy\u0142.","settings.tip":"Jako\u015B\u0107 wp\u0142ywa na animacje i efekty wody (poprawia FPS na s\u0142abych urz\u0105dzeniach).","settings.privacy":"Ta gra zbiera anonimowe dane analityczne z rozgrywki (GameAnalytics), aby ulepsza\u0107 gr\u0119.","settings.progress":"Post\u0119p","settings.progress.buildings":"Budynki","settings.progress.upgrades":"Ulepszenia","settings.legal.link":"Prywatno\u015B\u0107 i warunki","settings.legal.title":"PRYWATNO\u015A\u0106 I WARUNKI","settings.legal.body":"Tw\xF3rca: Aiwa Int\nKontakt: aiwainit2023@gmail.com\n\nTa gra jest dystrybuowana na platformie CrazyGames. Graj\u0105c w ni\u0105, akceptujesz poni\u017Csze punkty.\n\n1. ZBIERANE DANE\n\u2022 Reklamy (CrazyGames Ads). Reklamy s\u0105 wy\u015Bwietlane WY\u0141\u0104CZNIE przez CrazyGames Ads SDK. Aby wy\u015Bwietla\u0107 i mierzy\u0107 reklamy, CrazyGames i ich partnerzy reklamowi mog\u0105 przetwarza\u0107 dane techniczne, takie jak typ urz\u0105dzenia, przegl\u0105darka, adres IP (dla przybli\u017Conej lokalizacji) oraz interakcje z reklamami. Zajmuje si\u0119 tym CrazyGames zgodnie z w\u0142asn\u0105 Polityk\u0105 prywatno\u015Bci (crazygames.com/privacy). Nie u\u017Cywamy \u017Cadnej innej sieci reklamowej.\n\u2022 Analityka. U\u017Cywamy GameAnalytics do zbierania ANONIMOWYCH danych z rozgrywki \u2014 zdarze\u0144 w grze, d\u0142ugo\u015Bci sesji, post\u0119p\xF3w, typu urz\u0105dzenia i kraju \u2014 aby zrozumie\u0107, jak gra si\u0119 w gr\u0119, i j\u0105 ulepsza\u0107. Nie s\u0142u\u017C\u0105 one do identyfikacji Twojej osoby. Zobacz gameanalytics.com/privacy.\n\u2022 Zapisany post\u0119p. Tw\xF3j post\u0119p i ustawienia s\u0105 przechowywane lokalnie w przegl\u0105darce, a na CrazyGames mog\u0105 by\u0107 synchronizowane przez zapis w chmurze CrazyGames, aby\u015B m\xF3g\u0142 kontynuowa\u0107 na r\xF3\u017Cnych urz\u0105dzeniach.\n\n2. CZEGO NIE ROBIMY\n\u2022 Nigdy nie prosimy o Twoje imi\u0119, e-mail ani \u017Cadne osobiste konto w grze.\n\u2022 Nie sprzedajemy Twoich danych osobowych.\n\u2022 Nie korzystamy z \u017Cadnej zewn\u0119trznej sieci reklamowej poza CrazyGames.\n\n3. DZIECI\nGra jest odpowiednia dla og\xF3lnej publiczno\u015Bci (PEGI 12). Nie zbiera \u015Bwiadomie danych osobowych dzieci. Reklamy i analityka podlegaj\u0105 zasadom platformy CrazyGames.\n\n4. TWOJE WYBORY\nMo\u017Cesz w ka\u017Cdej chwili usun\u0105\u0107 dane zapisane lokalnie, czyszcz\u0105c pami\u0119\u0107 przegl\u0105darki lub u\u017Cywaj\u0105c \u201ENowa gra\u201D w Ustawieniach. W sprawie danych przetwarzanych na platformie CrazyGames zobacz Polityk\u0119 prywatno\u015Bci CrazyGames.\n\n5. WARUNKI KORZYSTANIA\nGra jest udost\u0119pniana \u201Etak jak jest\u201D, w celac
