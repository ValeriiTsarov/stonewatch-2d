2014 wachse, expandiere, erobere."},es:{"quests.label":"Objetivo","quests.chop.title":"Tala un \xE1rbol","quests.chop.hint":"Toca un \xE1rbol hasta que caiga un tronco: los aldeanos lo llevan al castillo por oro.","quests.land.title":"Eleva tierra","quests.land.hint":"Toca 3 veces una casilla de agua enmarcada: m\xE1s tierra trae edificios y recursos.","quests.upgrade.title":"Compra una mejora","quests.upgrade.hint":"Pulsa el bot\xF3n MEJORA hasta llenar la barra: tus tropas se fortalecen al instante.","quests.wave3.title":"Sobrevive a la oleada 3","quests.wave3.hint":"Tu guarnici\xF3n lucha sola. Mira c\xF3mo aguantan los muros y sigue construyendo.","quests.spell.title":"Lanza un hechizo","quests.spell.hint":"Toca un hechizo abajo durante el combate: curaci\xF3n, furia o maldici\xF3n.","quests.complete.title":"\xA1Bien hecho!","quests.complete.hint":"De aqu\xED en adelante, t\xFA decides: crece, expande, conquista."},fr:{"quests.label":"Objectif","quests.chop.title":"Coupe un arbre","quests.chop.hint":"Touche un arbre jusqu'\xE0 ce qu'une b\xFBche tombe : les paysans l'apportent au ch\xE2teau contre de l'or.","quests.land.title":"\xC9l\xE8ve la terre","quests.land.hint":"Touche 3 fois une case d'eau encadr\xE9e : plus de terre, plus de b\xE2timents et de ressources.","quests.upgrade.title":"Ach\xE8te une am\xE9lioration","quests.upgrade.hint":"Clique sur AM\xC9LIORATION jusqu'\xE0 remplir la barre : tes troupes se renforcent aussit\xF4t.","quests.wave3.title":"Survis \xE0 la vague 3","quests.wave3.hint":"Ta garnison se bat seule. Regarde les murs tenir, puis continue \xE0 b\xE2tir.","quests.spell.title":"Lance un sort","quests.spell.hint":"Touche un sort en bas de l'\xE9cran pendant un combat : soin, rage ou mal\xE9diction.","quests.complete.title":"Bien jou\xE9 !","quests.complete.hint":"\xC0 partir de l\xE0, c'est toi qui d\xE9cides : grandis, \xE9tends-toi, conquiers."},it:{"quests.label":"Obiettivo","quests.chop.title":"Taglia un albero","quests.chop.hint":"To
