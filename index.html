    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        /* Scale.FIT letterboxes the fixed design box; what `html`/`body` paint is what shows in
           those bars — BLACK, so nothing competes with the game box. The canvas keeps the
           preloader colour (= visuals/ui/preloader bgColor + capacitor android.backgroundColor +
           the Android launch theme: one colour from the icon tap to the first Phaser frame). */
        html, body { background: #000; height: 100%; overflow: hidden; margin: 0; }
        canvas { background: #3aacab; }
        /* touch-action: none → the browser stops claiming pan/pinch, so every touch reaches Phaser
           (pinch-zoom + camera drag). overscroll-behavior kills the pull-to-refresh bounce.
           `html` is in the list too: Chrome on Android resolves a pinch against the ROOT element, so
           leaving it `auto` let the gesture leak into browser page-zoom once our own zoom hit its
           clamp — and `maximum-scale=1` then snapped the page back, which read as the zoom looping. */
        html, body, canvas { touch-action: none; overscroll-behavior: none;
                       -webkit-user-select: none; user-select: none;
                       -webkit-tap-highlight-color: transparent; }
    </style>

F \u043F\u043E\u043A\u0430\u0437\u0443 \u0442\u0430 \u0432\u0438\u043C\u0456\u0440\u044E\u0432\u0430\u043D\u043D\u044F \u0440\u0435\u043A\u043B\u0430\u043C\u0438 CrazyGames \u0456 \u0457\u0445\u043D\u0456 \u0440\u0435\u043A\u043B\u0430\u043C\u043D\u0456 \u043F\u0430\u0440\u0442\u043D\u0435\u0440\u0438 \u043C\u043E\u0436\u0443\u0442\u044C \u043E\u0431\u0440\u043E\u0431\u043B\u044F\u0442\u0438 \u0442\u0435\u0445\u043D\u0456\u0447\u043D\u0456 \u0434\u0430\u043D\u0456: \u0442\u0438\u043F \u043F\u0440\u0438\u0441\u0442\u0440\u043E\u044E, \u0431\u0440\u0430\u0443\u0437\u0435\u0440, IP-\u0430\u0434\u0440\u0435\u0441\u0443 (\u0434\u043B\u044F \u043F\u0440\u0438\u0431\u043B\u0438\u0437\u043D\u043E\u0433\u043E \u043C\u0456\u0441\u0446\u0435\u0437\u043D\u0430\u0445\u043E\u0434\u0436\u0435\u043D\u043D\u044F) \u0442\u0430 \u0432\u0437\u0430\u0454\u043C\u043E\u0434\u0456\u044E \u0437 \u0440\u0435\u043A\u043B\u0430\u043C\u043E\u044E. \u0426\u0435 \u0440\u0435\u0433\u0443\u043B\u044E\u0454 CrazyGames \u0437\u0433\u0456\u0434\u043D\u043E \u0437 \u0432\u043B\u0430\u0441\u043D\u043E\u044E \u041F\u043E\u043B\u0456\u0442\u0438\u043A\u043E\u044E \u043A\u043E\u043D\u0444\u0456\u0434\u0435\u043D\u0446\u0456\u0439\u043D\u043E\u0441\u0442\u0456 (crazygames.com/privacy). \u0406\u043D\u0448\u0438\u0445 \u0440\u0435\u043A\u043B\u0430\u043C\u043D\u0438\u0445 \u043C\u0435\u0440\u0435\u0436 \u043C\u0438 \u043D\u0435 \u0432\u0438\u043A\u043E\u0440\u0438\u0441\u0442\u043E\u0432\u0443\u0454\u043C\u043E.\n\u2022 \u0410\u043D\u0430\u043B\u0456\u0442\u0438\u043A\u0430. \u041C\u0438 \u0432\u0438\u043A\u043E\u0440\u0438\u0441\u0442\u043E\u0432\u0443\u0454\u043C\u043E GameAnalytics \u0434\u043B\u044F \u0437\u0431\u043E\u0440\u0443 \u0410\u041D\u041E\u041D\u0406\u041C\u041D\u0418\u0425 \u0456\u0433\u0440\u043E\u0432\u0438\u0445 \u0434\u0430\u043D\u0438\u0445 \u2014 \u0456\u0433\u0440\u043E\u0432\u0456 \u043F\u043E\u0434\u0456\u0457, \u0442\u0440\u0438\u0432\u0430\u043B\u0456\u0441\u0442\u044C \u0441\u0435\u0441\u0456\u0457, \u043F\u0440\u043E\u0433\u0440\u0435\u0441, \u0442\u0438\u043F \u043F\u0440\u0438\u0441\u0442\u0440\u043E\u044E \u0442\u0430 \u043A\u0440\u0430\u0457\u043D\u0430 \u2014 \u0449\u043E\u0431 \u0440\u043E\u0437\u0443\u043C\u0456\u0442\u0438, \u044F\u043A \u0433\u0440\u0430\u044E\u0442\u044C, \u0456 \u043F\u043E\u043A\u0440\u0430\u0449\u0443\u0432\u0430\u0442\u0438 \u0433\u0440\u0443. \u0426\u0456 \u0434\u0430\u043D\u0456 \u043D\u0435 \u0456\u0434\u0435\u043D\u0442\u0438\u0444\u0456\u043A\u0443\u044E\u0442\u044C \u0432\u0430\u0441 \u043E\u0441\u043E\u0431\u0438\u0441\u0442\u043E. \u0414\u0438\u0432. gameanalytics.com/privacy.\n\u2022 \u0417\u0431\u0435\u0440\u0435\u0436\u0435\u043D\u043D\u044F \u043F\u0440\u043E\u0433\u0440\u0435\u0441\u0443. \u0412\u0430\u0448 \u043F\u0440\u043E\u0433\u0440\u0435\u0441 \u0456 \u043D\u0430\u043B\u0430\u0448\u0442\u0443\u0432\u0430\u043D\u043D\u044F \u0437\u0431\u0435\u0440\u0456\u0433\u0430\u044E\u0442\u044C\u0441\u044F \u043B\u043E\u043A\u0430\u043B\u044C\u043D\u043E \u0432 \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0456, \u0430 \u043D\u0430 CrazyGames \u043C\u043E\u0436\u0443\u0442\u044C \u0441\u0438\u043D\u0445\u0440\u043E\u043D\u0456\u0437\u0443\u0432\u0430\u0442\u0438\u0441\u044F \u0447\u0435\u0440\u0435\u0437 \u0445\u043C\u0430\u0440\u043D\u0435 \u0437\u0431\u0435\u0440\u0435\u0436\u0435\u043D\u043D\u044F CrazyGames, \u0449\u043E\u0431 \u0432\u0438 \u043C\u043E\u0433\u043B\u0438 \u043F\u0440\u043E\u0434\u043E\u0432\u0436\u0438\u0442\u0438 \u043D\u0430 \u0456\u043D\u0448\u0438\u0445 \u043F\u0440\u0438\u0441\u0442\u0440\u043E\u044F\u0445.\n\n2. \u0427\u041E\u0413\u041E \u041C\u0418 \u041D\u0415 \u0420\u041E\u0411\u0418\u041C\u041E\n\u2022 \u041D\u0456\u043A\u043E\u043B\u0438 \u043D\u0435 \u0437\u0430\u043F\u0438\u0442\u0443\u0454\u043C\u043E \u0432\u0430\u0448\u0435 \u0456\u043C\u02BC\u044F, email \u0447\u0438 \u043E\u0441\u043E\u0431\u0438\u0441\u0442\u0438\u0439 \u0430\u043A\u0430\u0443\u043D\u0442 \u0443 \u0433\ fizieren. Siehe gameanalytics.com/privacy.\n\u2022 Gespeicherter Fortschritt. Dein Fortschritt und deine Einstellungen werden lokal in deinem Browser gespeichert und k\xF6nnen auf CrazyGames \xFCber den CrazyGames-Cloud-Speicher synchronisiert werden, damit du auf mehreren Ger\xE4ten weiterspielen kannst.\n\n2. WAS WIR NICHT TUN\n\u2022 Wir fragen niemals nach deinem Namen, deiner E-Mail oder einem pers\xF6nlichen Konto im Spiel.\n\u2022 Wir verkaufen deine personenbezogenen Daten nicht.\n\u2022 Wir nutzen au\xDFer CrazyGames kein Werbenetzwerk von Drittanbietern.\n\n3. KINDER\nDas Spiel ist f\xFCr ein allgemeines Publikum geeignet (PEGI 12). Es erfasst nicht wissentlich personenbezogene Daten von Kindern. Werbung und Analyse folgen den Richtlinien der CrazyGames-Plattform.\n\n4. DEINE WAHLM\xD6GLICHKEITEN\nDu kannst lokal gespeicherte Daten jederzeit l\xF6schen, indem du deinen Browser-Speicher leerst oder in den Einstellungen \u201ENeues Spiel\u201C verwendest. F\xFCr auf der CrazyGames-Plattform verarbeitete Daten siehe die Datenschutzrichtlinie von CrazyGames.\n\n5. NUTZUNGSBEDINGUNGEN\nDieses Spiel wird \u201Ewie besehen\u201C zu Unterhaltungszwecken ohne jegliche Gew\xE4hrleistung bereitgestellt. Wir haften nicht f\xFCr Sch\xE4den, die aus seiner Nutzung entstehen. Alle Assets werden gem\xE4\xDF ihren jeweiligen Lizenzen verwendet. Diese Bedingungen k\xF6nnen sich \xE4ndern; fortgesetztes Spielen bedeutet, dass du die aktuelle Version akzeptierst.\n\n6. KONTAKT\nFragen zu dieser Richtlinie: Aiwa Int \u2014 aiwainit2023@gmail.com"},es:{"settings.title":"AJUSTES","settings.graphics":"Gr\xE1ficos","settings.quality":"Calidad","settings.quality.low":"baja","settings.quality.medium":"media","settings.quality.high":"alta","settings.language":"Idioma","settings.music":"M\xFAsica","settings.sound":"Sonido","settings.ambient":"Ambiente","settings.skipTutorial":"Saltar tutorial","settings.logPanel":"Registro de depuraci\xF3n","settings.on":"Activado","settings.off":"Des en.","quests.summonLancer.title":"Beschw\xF6re einen Pikenier","quests.summonLancer.hint":"Tippe die Pikenier-Karte an \u2014 die erste Beschw\xF6rung ist gratis.","quests.summonPeasant.title":"Beschw\xF6re einen Bauern","quests.summonPeasant.hint":"Tippe die Bauern-Karte an \u2014 sie kostet je einen Haufen jeder Ressource.","quests.buildTower.title":"Bau den Turm","quests.buildTower.hint":"Klicke den BAUEN-Knopf, bis der Balken voll ist \u2014 der Turm wird errichtet.","quests.hitEnemy.title":"Triff einen Feind","quests.hitEnemy.hint":"Klicke einen angreifenden Feind \u2014 deine Klicks verletzen ihn ebenfalls.","quests.hitBarrel.title":"Sprenge ein Fass","quests.hitBarrel.hint":"Klicke ein rollendes Fass, bevor es die Mauern erreicht.","quests.complete.title":"Gut gemacht!","quests.complete.hint":"Ab hier entscheidest du \u2014 wachse, expandiere, erobere."},es:{"quests.label":"Objetivo","quests.chest.title":"Toca el cofre","quests.chest.hint":"Un cofre flota junto a la orilla: t\xF3calo para abrirlo.","quests.rally.title":"Dirige a tus soldados","quests.rally.hint":"Toca la isla: tus soldados corren all\xED y luchan contra lo que encuentren.","quests.land.title":"Eleva tierra","quests.land.hint":"Toca 3 veces una casilla de agua enmarcada: m\xE1s tierra trae edificios y recursos.","quests.summonLancer.title":"Invoca un piquero","quests.summonLancer.hint":"Toca la carta del piquero: la primera invocaci\xF3n es gratis.","quests.summonPeasant.title":"Invoca un campesino","quests.summonPeasant.hint":"Toca la carta del campesino: cuesta un mont\xF3n de cada recurso.","quests.buildTower.title":"Construye la Torre","quests.buildTower.hint":"Pulsa el bot\xF3n CONSTRUIR hasta llenar la barra: la Torre empieza a levantarse.","quests.hitEnemy.title":"Golpea a un enemigo","quests.hitEnemy.hint":"Haz clic en un enemigo atacante: tus clics tambi\xE9n le hacen da\xF1o.","quests.hitBarrel.title":"Revienta un barril","quests.hitBarrel.hint":"Haz clic en un barril rodante antes de que llegue a los muros.","quests.complete.title":"\xA1Bien hecho!","quests.complete.hint":"De aqu\xED en adelante, t\xFA decides: crece, expande, conquista."},fr:{"quests.label":"Objectif","quests.chest.title":"Touche le coffre","quests.chest.hint":"Un coffre flotte pr\xE8s du rivage : touche-le pour l'ouvrir.","quests.rally.title":"Commande tes soldats","quests.rally.hint":"Touche l'\xEEle : tes soldats y courent et combattent tout ce qu'ils croisent.","quests.land.title":"\xC9l\xE8ve la terre","quests.land.hint":"Touche 3 fois une case d'eau encadr\xE9e : plus de terre, plus de b\xE2timents et de ressources.","quests.summonLancer.title":"Invoque un piquier","quests.summonLancer.hint":"Touche la carte du piquier : la premi\xE8re invocation est gratuite.","quests.summonPeasant.title":"Invoque un paysan","quests.summonPeasant.hint":"Touche la carte du paysan : il co\xFBte un tas de chaque ressource.","quests.buildTower.title":"Construis la Tour","quests.buildTower.hint":"Clique sur CONSTRUIRE jusqu'\xE0 remplir la barre : la Tour commence \xE0 s'\xE9lever.","quests.hitEnemy.title":"Frappe un ennemi","quests.hitEnemy.hint":"Clique sur un ennemi qui attaque : tes clics lui font aussi des d\xE9g\xE2ts.","quests.hitBarrel.title":"Fais sauter un baril","quests.hitBarrel.hint":"Clique sur un baril qui roule avant qu'il n'atteigne les murs.","quests.complete.title":"Bien jou\xE9 !","quests.complete.hint":"\xC0 partir de l\xE0, c'est toi qui d\xE9cides : grandis, \xE9tends-toi, conquiers."},it:{"quests.label":"Obiettivo","quests.chest.title":"Tocca lo scrigno","quests.chest.hint":"Uno scrigno galleggia vicino alla riva: toccalo per aprirlo.","quests.rally.title":"Comanda i tuoi soldati","quests.rally.hint":"Tocca l'isola: i tuoi soldati corrono l\xEC e combattono chi incontrano.","quests.land.title":"Solleva la terra","quests.land.hint":"Tocca 3 volte una casella d'acqua incorniciata: pi\xF9 terra porta nuovi edifici e risorse.","quests.summonLancer.title":"Evoca un picchiere","quests.summonLancer.hint":"Tocca la carta del picchiere: la prima evocazione \xE8 gratis.","quests.summonPeasant.title":"Evoca un contadino","quests.summonPeasant.hint":"Tocca la carta del contadino: costa un mucchio di ogni risorsa.","quests.buildTower.title":"Costruisci la Torre","quests.buildTower.hint":"Premi il tasto COSTRUISCI finch\xE9 la barra si riempie: la Torre inizia a sorgere.","quests.hitEnemy.title":"Colpisci un nemico","quests.hitEnemy.hint":"Clicca un nemico che attacca: anche i tuoi clic gli fanno danno.","quests.hitBarrel.title":"Fai saltare un barile","quests.hitBarrel.hint":"Clicca un barile che rotola prima che raggiunga le mura.","quests.complete.title":"Ben fatto!","quests.complete.hint":"Da qui in poi decidi tu: cresci, espanditi, conquista."},pl:{"quests.label":"Cel","quests.chest.title":"Dotknij skrzyni","quests.chest.hint":"Przy brzegu dryfuje skrzynia \u2014 dotknij jej, aby j\u0105 otworzy\u0107.","quests.rally.title":"Dowod\u017A \u017Co\u0142nierzami","quests.rally.hint":"Dotknij wyspy \u2014 \u017Co\u0142nierze pobiegn\u0105 tam i zaatakuj\u0105 ka\u017Cdego, kogo spotkaj\u0105.","quests.land.title":"Podnie\u015B l\u0105d","quests.land.hint":"Kliknij 3 razy pole wody w ramce \u2014 wi\u0119cej l\u0105du to nowe budynki i surowce.","quests.summonLancer.title":"Przywo\u0142aj pikiniera","quests.summonLancer.hint":"Stuknij kart\u0119 pikiniera \u2014 pierwsze przywo\u0142anie jest darmowe.","quests.summonPeasant.title":"Przywo\u0142aj ch\u0142opa","quests.summonPeasant.hint":"Stuknij kart\u0119 ch\u0142opa \u2014 kosztuje po jednym stosie ka\u017Cdego surowca.","quests.buildTower.title":"Zbuduj Wie\u017C\u0119","quests.buildTower.hint":"Klikaj przycisk BUDUJ, a\u017C pasek si\u0119 wype\u0142ni \u2014 rusza budowa Wie\u017Cy.","quests.hitEnemy.title":"Trafi we wroga","quests.hitEnemy.hint":"Kliknij atakuj\u0105cego wroga \u2014 twoje klikni\u0119cia te\u017C zadaj\u0105 obra\u017Cenia.","quests.hitBarrel.title":"Wysad\u017A beczk\
