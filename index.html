ipo di dispositivo e paese \u2014 per capire come viene giocato il gioco e migliorarlo. Non vengono usati per identificarti personalmente. Vedi gameanalytics.com/privacy.\n\u2022 Progressi salvati. I tuoi progressi e le impostazioni sono salvati localmente nel tuo browser e, su CrazyGames, possono essere sincronizzati tramite il salvataggio cloud di CrazyGames per farti continuare su pi\xF9 dispositivi.\n\n2. COSA NON FACCIAMO\n\u2022 Non ti chiediamo mai il nome, l\u2019email o alcun account personale nel gioco.\n\u2022 Non vendiamo i tuoi dati personali.\n\u2022 Non usiamo alcun network pubblicitario di terze parti oltre a CrazyGames.\n\n3. BAMBINI\nIl gioco \xE8 adatto a un pubblico generale (PEGI 12). Non raccoglie consapevolmente informazioni personali dai bambini. Pubblicit\xE0 e analisi seguono le politiche della piattaforma CrazyGames.\n\n4. LE TUE SCELTE\nPuoi cancellare i dati salvati localmente in qualsiasi momento svuotando l\u2019archivio del browser o usando \xABNuova partita\xBB nelle Impostazioni. Per i dati trattati sulla piattaforma CrazyGames, consulta l\u2019Informativa sulla privacy di CrazyGames.\n\n5. CONDIZIONI D\u2019USO\nQuesto gioco \xE8 fornito \xABcos\xEC com\u2019\xE8\xBB, a scopo di intrattenimento, senza garanzie di alcun tipo. Non siamo responsabili di eventuali perdite derivanti dal suo utilizzo. Tutte le risorse sono usate secondo le rispettive licenze. Queste condizioni possono cambiare; continuare a giocare significa accettare la versione corrente.\n\n6. CONTATTO\nDomande su questa informativa: Aiwa Int \u2014 aiwainit2023@gmail.com"},pl:{"settings.title":"USTAWIENIA","settings.graphics":"Grafika","settings.quality":"Jako\u015B\u0107","settings.quality.low":"niska","settings.quality.medium":"\u015Brednia","settings.quality.high":"wysoka","settings.language":"J\u0119zyk","settings.music":"Muzyka","settings.sound":"D\u017Awi\u0119k","settings.ambient":"Otoczenie","settings.skipTutorial":"Pomi\u0144 samouczek","settings.logPanel":"D
