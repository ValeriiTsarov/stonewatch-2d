    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        /* Scale.FIT letterboxes the fixed design box; what `html`/`body` paint is what shows in
           those bars — BLACK, so nothing competes with the game box. The canvas keeps the
           preloader colour (= visuals/ui/preloader bgColor + capacitor android.backgroundColor +
           the Android launch theme: one colour from the icon tap to the first Phaser frame). */
        html, body { background: #000; height: 100%; overflow: hidden; margin: 0; }
        canvas { background: #3aacab; }
        /* touch-action: none → the browser stops claiming pan/pinch, so every touch reaches Phaser
           (pinch-zoom + camera drag). overscroll-behavior kills the pull-to-refresh bounce.
           `html` is in the list too: Chrome on Android resolves a pinch against the ROOT element, so
           leaving it `auto` let the gesture leak into browser page-zoom once our own zoom hit its
           clamp — and `maximum-scale=1` then snapped the page back, which read as the zoom looping. */
        html, body, canvas { touch-action: none; overscroll-behavior: none;
                       -webkit-user-select: none; user-select: none;
                       -webkit-tap-highlight-color: transparent; }
    </style>

ser e, su CrazyGames, possono essere sincronizzati tramite il salvataggio cloud di CrazyGames per farti continuare su pi\xF9 dispositivi.\n\n2. COSA NON FACCIAMO\n\u2022 Non ti chiediamo mai il nome, l\u2019email o alcun account personale nel gioco.\n\u2022 Non vendiamo i tuoi dati personali.\n\u2022 Non usiamo alcun network pubblicitario di terze parti oltre a CrazyGames.\n\n3. BAMBINI\nIl gioco \xE8 adatto a un pubblico generale (PEGI 12). Non raccoglie consapevolmente informazioni personali dai bambini. Pubblicit\xE0 e analisi seguono le politiche della piattaforma CrazyGames.\n\n4. LE TUE SCELTE\nPuoi cancellare i dati salvati localmente in qualsiasi momento svuotando l\u2019archivio del browser o usando \xABNuova partita\xBB nelle Impostazioni. Per i dati trattati sulla piattaforma CrazyGames, consulta l\u2019Informativa sulla privacy di CrazyGames.\n\n5. CONDIZIONI D\u2019USO\nQuesto gioco \xE8 fornito \xABcos\xEC com\u2019\xE8\xBB, a scopo di intrattenimento, senza garanzie di alcun tipo. Non siamo responsabili di eventuali perdite derivanti dal suo utilizzo. Tutte le risorse sono usate secondo le rispettive licenze. Queste condizioni possono cambiare; continuare a giocare significa accettare la versione corrente.\n\n6. CONTATTO\nDomande su questa informativa: Aiwa Int \u2014 aiwainit2023@gmail.com"},pl:{"settings.title":"USTAWIENIA","settings.graphics":"Grafika","settings.quality":"Jako\u015B\u0107","settings.quality.low":"niska","settings.quality.medium":"\u015Brednia","settings.quality.high":"wysoka","settings.language":"J\u0119zyk","settings.music":"Muzyka","settings.sound":"D\u017Awi\u0119k","settings.ambient":"Otoczenie","settings.skipTutorial":"Pomi\u0144 samouczek","settings.logPanel":"Dziennik debugowania","settings.on":"w\u0142.","settings.off":"wy\u0142.","settings.tip":"Jako\u015B\u0107 wp\u0142ywa na animacje i efekty wody (poprawia FPS na s\u0142abych urz\u0105dzeniach).","settings.privacy":"Ta gra zbiera anonimowe dane analityczne z rozgrywki (  recolecta solo. Toca los tres: los aldeanos llevan lo obtenido al castillo por oro.","quests.land.title":"Eleva tierra","quests.land.hint":"Toca 3 veces una casilla de agua enmarcada: m\xE1s tierra trae edificios y recursos.","quests.buildTower.title":"Construye la Torre","quests.buildTower.hint":"Pulsa el bot\xF3n CONSTRUIR hasta llenar la barra: la Torre empieza a levantarse.","quests.hitEnemy.title":"Golpea a un enemigo","quests.hitEnemy.hint":"Haz clic en un enemigo atacante: tus clics tambi\xE9n le hacen da\xF1o.","quests.hitBarrel.title":"Revienta un barril","quests.hitBarrel.hint":"Haz clic en un barril rodante antes de que llegue a los muros.","quests.complete.title":"\xA1Bien hecho!","quests.complete.hint":"De aqu\xED en adelante, t\xFA decides: crece, expande, conquista."},fr:{"quests.label":"Objectif","quests.chop.title":"Touche les trois","quests.chop.hint":"Une seule touche et la ressource se r\xE9colte toute seule. Touche les trois : les paysans portent le butin au ch\xE2teau contre de l'or.","quests.land.title":"\xC9l\xE8ve la terre","quests.land.hint":"Touche 3 fois une case d'eau encadr\xE9e : plus de terre, plus de b\xE2timents et de ressources.","quests.buildTower.title":"Construis la Tour","quests.buildTower.hint":"Clique sur CONSTRUIRE jusqu'\xE0 remplir la barre : la Tour commence \xE0 s'\xE9lever.","quests.hitEnemy.title":"Frappe un ennemi","quests.hitEnemy.hint":"Clique sur un ennemi qui attaque : tes clics lui font aussi des d\xE9g\xE2ts.","quests.hitBarrel.title":"Fais sauter un baril","quests.hitBarrel.hint":"Clique sur un baril qui roule avant qu'il n'atteigne les murs.","quests.complete.title":"Bien jou\xE9 !","quests.complete.hint":"\xC0 partir de l\xE0, c'est toi qui d\xE9cides : grandis, \xE9tends-toi, conquiers."},it:{"quests.label":"Obiettivo","quests.chop.title":"Tocca tutti e tre","quests.chop.hint":"Un tocco e la risorsa si raccoglie da sola. Tocca tutti e tre: i contadini portano il raccolto al castello in cambio di oro.","quests.land.title":"Solleva la terra","quests.land.hint":"Tocca 3 volte una casella d'acqua incorniciata: pi\xF9 terra porta nuovi edifici e risorse.","quests.buildTower.title":"Costruisci la Torre","quests.buildTower.hint":"Premi il tasto COSTRUISCI finch\xE9 la barra si riempie: la Torre inizia a sorgere.","quests.hitEnemy.title":"Colpisci un nemico","quests.hitEnemy.hint":"Clicca un nemico che attacca: anche i tuoi clic gli fanno danno.","quests.hitBarrel.title":"Fai saltare un barile","quests.hitBarrel.hint":"Clicca un barile che rotola prima che raggiunga le mura.","quests.complete.title":"Ben fatto!","quests.complete.hint":"Da qui in poi decidi tu: cresci, espanditi, conquista."},pl:{"quests.label":"Cel","quests.chop.title":"Dotknij wszystkich trzech","quests.chop.hint":"Jedno klikni\u0119cie i surowiec wydobywa si\u0119 sam. Dotknij ka\u017Cdego z trzech \u2014 ch\u0142opi zanios\u0105 \u0142up do zamku za z\u0142oto.","quests.land.title":"Podnie\u015B l\u0105d","quests.land.hint":"Kliknij 3 razy pole wody w ramce \u2014 wi\u0119cej l\u0105du to nowe budynki i surowce.","quests.buildTower.title":"Zbuduj Wie\u017C\u0119","quests.buildTower.hint":"Klikaj przycisk BUDUJ, a\u017C pasek si\u0119 wype\u0142ni \u2014 rusza budowa Wie\u017Cy.","quests.hitEnemy.title":"Trafi we wroga","quests.hitEnemy.hint":"Kliknij atakuj\u0105cego wroga \u2014 twoje klikni\u0119cia te\u017C zadaj\u0105 obra\u017Cenia.","quests.hitBarrel.title":"Wysad\u017A beczk\u0119","quests.hitBarrel.hint":"Kliknij tocz\u0105c\u0105 si\u0119 beczk\u0119, zanim dotrze do mur\xF3w.","quests.complete.title":"Dobra robota!","quests.complete.hint":"Od teraz decyzja nale\u017Cy do ciebie \u2014 rozwijaj si\u0119, poszerzaj, podbijaj."},pt:{"quests.label":"Meta","quests.chop.title":"Toque nos tr\xEAs","quests.chop.hint":"Um toque p\xF5e o recurso a render \u2014 ele continua sozinho. Toque em cada um dos tr\xEAs; os camponeses levam tudo ao castelo por moedas.","quests.land.title":"Erga terra","quests.land.hint":"Toque 3 vezes numa c\xE9lula de \xE1gua emoldurada \u2014 mais terra traz novas constru\xE7\xF5es e recursos.","quests.buildTower.title":"Construa a Torre","quests.buildTower.hint":"Clique no bot\xE3o CONSTRUIR at\xE9 a barra encher \u2014 a Torre come\xE7a a subir.","quests.hitEnemy.title":"Acerte um inimigo","quests.hitEnemy.hint":"Clique num inimigo que ataca \u2014 seus cliques tamb\xE9m causam dano.","quests.hitBarrel.title":"Exploda um barril","quests.hitBarrel.hint":"Clique num barril rolando antes que ele chegue \xE0s muralhas.","quests.complete.title":"Muito bem!","quests.complete.hint":"Daqui em diante \xE9 com voc\xEA \u2014 cres\xE7a, expanda, conquiste."}};var Cy={en:{"goals.label":"Goals","goals.done":"Goal done!  +{reward} \u{1F48E}","goals.wave5.title":"Survive wave 5","goals.wave10.title":"Survive wave 10","goals.wave25.title":"Survive wave 25","goals.coins1k.title":"1000 coins","goals.coins5k.title":"5000 coins","goals.build10.title":"10 building levels"},uk:{"goals.label":"\u0426\u0456\u043B\u0456","goals.done":"\u0426\u0456\u043B\u044C \u0432\u0438\u043A\u043E\u043D\u0430\u043D\u043E!  +{reward} \u{1F48E}","goals.wave5.title":"\u041F\u0435\u0440\u0435\u0436\u0438\u0432\u0438 \u0445\u0432\u0438\u043B\u044E 5","goals.wave10.title":"\u041F\u0435\u0440\u0435\u0436\u0438\u0432\u0438 \u0445\u0432\u0438\u043B\u044E 10","goals.wave25.title":"\u041F\u0435\u0440\u0435\u0436\u0438\u0432\u0438 \u0445\u0432\u0438\u043B\u044E 25","goals.coins1k.title":"1000 \u043C\u043E\u043D\u0435\u0442","goals.coins5k.title":"5000 \u043C\u043E\u043D\u0435\u0442","goals.build10.title":"10 \u0440\u0456\u0432\u043D\u0456\u0432 \u0431\u0443\u0434\u0456\u0432\u0435\u043B\u044C"},de:{"goals.label":"Ziele","goals.done":"Ziel erf\xFCllt!  +{reward} \u{1F48E}","goals.wave5.title":"Welle 5 \xFCberstehen","goals.wave10.title":"Welle 10 \xFCberstehen","goals.wave25.title":"Welle 25 \xFCberstehen","goals.coins1k.title":"1000 M\xFCnzen","goals.coins5k.title":"5000 M\xFCnzen","goals
