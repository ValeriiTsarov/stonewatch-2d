    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        /* Scale.FIT letterboxes the fixed design box; what `html`/`body` paint is what shows in
           those bars — BLACK, so nothing competes with the game box. The canvas keeps the
           preloader colour (= visuals/ui/preloader bgColor + capacitor android.backgroundColor +
           the Android launch theme: one colour from the icon tap to the first Phaser frame). */
        html, body { background: #000; height: 100%; overflow: hidden; margin: 0; }
        canvas { background: #3aacab; }
        /* touch-action: none → the browser stops claiming pan/pinch, so every touch reaches Phaser
           (pinch-zoom + camera drag). overscroll-behavior kills the pull-to-refresh bounce.
           `html` is in the list too: Chrome on Android resolves a pinch against the ROOT element, so
           leaving it `auto` let the gesture leak into browser page-zoom once our own zoom hit its
           clamp — and `maximum-scale=1` then snapped the page back, which read as the zoom looping. */
        html, body, canvas { touch-action: none; overscroll-behavior: none;
                       -webkit-user-select: none; user-select: none;
                       -webkit-tap-highlight-color: transparent; }
    </style>

rowser o usando \xABNuova partita\xBB nelle Impostazioni. Per i dati trattati sulla piattaforma CrazyGames, consulta l\u2019Informativa sulla privacy di CrazyGames.\n\n5. CONDIZIONI D\u2019USO\nQuesto gioco \xE8 fornito \xABcos\xEC com\u2019\xE8\xBB, a scopo di intrattenimento, senza garanzie di alcun tipo. Non siamo responsabili di eventuali perdite derivanti dal suo utilizzo. Tutte le risorse sono usate secondo le rispettive licenze. Queste condizioni possono cambiare; continuare a giocare significa accettare la versione corrente.\n\n6. CONTATTO\nDomande su questa informativa: Aiwa Int \u2014 aiwainit2023@gmail.com"},pl:{"settings.title":"USTAWIENIA","settings.graphics":"Grafika","settings.quality":"Jako\u015B\u0107","settings.quality.low":"niska","settings.quality.medium":"\u015Brednia","settings.quality.high":"wysoka","settings.language":"J\u0119zyk","settings.music":"Muzyka","settings.sound":"D\u017Awi\u0119k","settings.ambient":"Otoczenie","settings.skipTutorial":"Pomi\u0144 samouczek","settings.logPanel":"Dziennik debugowania","settings.on":"w\u0142.","settings.off":"wy\u0142.","settings.tip":"Jako\u015B\u0107 wp\u0142ywa na animacje i efekty wody (poprawia FPS na s\u0142abych urz\u0105dzeniach).","settings.privacy":"Ta gra zbiera anonimowe dane analityczne z rozgrywki (GameAnalytics), aby ulepsza\u0107 gr\u0119.","settings.progress":"Post\u0119p","settings.progress.buildings":"Budynki","settings.progress.upgrades":"Ulepszenia","settings.legal.link":"Prywatno\u015B\u0107 i warunki","settings.legal.title":"PRYWATNO\u015A\u0106 I WARUNKI","settings.legal.body":"Tw\xF3rca: Aiwa Int\nKontakt: aiwainit2023@gmail.com\n\nTa gra jest dystrybuowana na platformie CrazyGames. Graj\u0105c w ni\u0105, akceptujesz poni\u017Csze punkty.\n\n1. ZBIERANE DANE\n\u2022 Reklamy (CrazyGames Ads). Reklamy s\u0105 wy\u015Bwietlane WY\u0141\u0104CZNIE przez CrazyGames Ads SDK. Aby wy\u015Bwietla\u0107 i mierzy\u0107 reklamy, CrazyGames i ich partnerzy reklamowi mog\u0105 przetwarza\u
